services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: class-booking-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
    networks:
      - laravel

  webserver:
    image: nginx:alpine
    container_name: class-booking-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel
    depends_on:
      - app

  node:
    image: node:18-alpine
    container_name: class-booking-node
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev
    networks:
      - laravel
    depends_on:
      - app

networks:
  laravel:
    driver: bridge
