# Nginx configuration for the Class Booking System.
# This serves Laravel's public/index.php via PHP-FPM (app service).
# Handles static assets, Inertia.js routing, and Vite proxy for development.
#
# Key features:
# - PHP-FPM proxy to 'app' container on port 9000.
# - Pretty URLs (try_files for Laravel routing).
# - Gzip compression for assets.
# - Vite dev proxy (http://localhost:5173 for HMR in development).
#
# Place this in ./docker/nginx.conf and reference in docker-compose.yml.

server {
    listen 80;  # Listen on port 80 (mapped to host 8000)
    index index.php index.html;  # Default index files
    error_log /var/log/nginx/error.log;  # Error log location
    access_log /var/log/nginx/access.log;  # Access log location
    root /var/www/html/public;  # Laravel public directory

    # Handle PHP files via PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;  # Check if file exists, else 404
        fastcgi_split_path_info ^(.+\.php)(/.+)$;  # Split path for Laravel
        fastcgi_pass app:9000;  # Proxy to PHP-FPM in 'app' container
        fastcgi_index index.php;  # Default PHP file
        include fastcgi_params;  # Standard FastCGI params
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;  # Script path
        fastcgi_param PATH_INFO $fastcgi_path_info;  # Path info for routing
    }

    # Serve static files and fallback to Laravel router
    location / {
        try_files $uri $uri/ /index.php?$query_string;  # SPA-like routing for Inertia.js
        gzip_static on;  # Enable gzip for pre-compressed assets
    }

    # Proxy Vite dev server for hot module replacement (development only)
    location /vite {
        proxy_pass http://node:5173;  # Forward to Node/Vite service
        proxy_set_header Host $host;  # Preserve host header
        proxy_set_header X-Real-IP $remote_addr;  # Client IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Forwarded headers
        proxy_set_header X-Forwarded-Proto $scheme;  # Protocol
    }

    # Security: Deny access to sensitive files
    location ~ /\. {
        deny all;  # Block .git, .env, etc.
    }

    # Optional: Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;  # Long cache for assets
        add_header Cache-Control "public, immutable";
    }
}
